apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-application
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mon-application

  template:
    metadata:
      labels:
        app: mon-application

    spec:
      containers:
        - name: nginx
          image: nginx:1.27.1-alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "5m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"