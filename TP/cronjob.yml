apiVersion: batch/v1
kind: CronJob
metadata:
  name: date
  namespace: default
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: date
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - date
          restartPolicy: OnFailure